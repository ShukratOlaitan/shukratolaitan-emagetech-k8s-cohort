apiVersion: apps/v1 
kind: Deployment
metadata:
  name: my-app
  namespace: default
  labels:
    app: my-app
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  revisionHistoryLimit: 3
  template:
    metadata:
      labels:
        app: my-app
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: my-app
          image: nginx:1.25.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80 
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet: {path: /health, port: 80}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 80}
            initialDelaySeconds: 15
            periodSeconds: 20