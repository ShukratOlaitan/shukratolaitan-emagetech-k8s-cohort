# templates/statefulset.yaml
apiVersion: v1
kind: Service
metadata:
  name: my-db          # Headless service required for StatefulSet DNS
spec:
  clusterIP: None      # Makes it headless — DNS returns pod IPs directly
  selector:
    app: my-db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: my-db
spec:
  serviceName: my-db   # Must match headless Service name
  replicas: 1
  podManagementPolicy: OrderedReady  # Start pods in order: 0, then 1, then 2
  selector:
    matchLabels:
      app: my-db
  template:
    metadata:
      labels:
        app: my-db
    spec:
      terminationGracePeriodSeconds: 60  # DBs need time to flush writes
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: db-secret, key: password}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:              # Each pod gets its own PVC
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi