apiVersion: v1
kind: Pod
metadata:
  name: liveness-fail
spec:
  containers:
  - name: app
    image: busybox
    command: [ "/bin/sh", "-c" ]
    args:
    - |
      touch /tmp/healthy
      sleep 20
      rm -f /tmp/healthy
      sleep 999
    livenessProbe:
      exec:
        command: [ cat, /tmp/healthy ]
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 3
